name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Bump version number
        id: version
        run: |
          CURRENT=$(cat DEPLOY_VERSION)
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > DEPLOY_VERSION
          echo "next_version=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Commit updated version file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_VERSION
          git commit -m "Bump deploy version to ${{ steps.version.outputs.next_version }}"
          git push

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /htdocs/${{ steps.version.outputs.next_version }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
